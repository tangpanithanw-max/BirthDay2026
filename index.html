<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&family=Itim&family=Sriracha&family=Pattaya&family=Mitr:wght@400;500&family=Prompt:wght@400;600&display=swap">
<style>
:root{--font:"Mali",system-ui,sans-serif;--bg1:#ffe3ec;--bg2:#ffc9dc;--ink:#5a2340;--card:#fffaf5;--accent:#e8557f;--soft:#fff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1030;--bg2:#4a1d4a;--ink:#ffe6f0;--card:#3a1a3e;--accent:#ff7aa2;--soft:#4d2450;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a1030;--bg2:#4a1d4a;--ink:#ffe6f0;--card:#3a1a3e;--accent:#ff7aa2;--soft:#4d2450;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));text-align:center;opacity:0;pointer-events:none;transform:scale(.97);transition:opacity .9s,transform .9s;overflow-y:auto}
.scene.active{opacity:1;pointer-events:auto;transform:none}
h1{font-size:1.7rem;color:var(--accent)}
.hint{font-size:1rem;opacity:.85;min-height:1.5em}
button.next{background:var(--accent);color:#fff;border:0;border-radius:99px;padding:12px 28px;font:inherit;font-size:1.05rem;cursor:pointer;box-shadow:0 6px 18px rgba(232,85,127,.4);opacity:0;pointer-events:none;transition:opacity .8s}
button.next.show{opacity:1;pointer-events:auto;animation:pop 1.6s infinite}
@keyframes pop{50%{transform:scale(1.07)}}
#cake{width:min(86vw,340px);height:auto;overflow:visible}
.candle{cursor:pointer}
.flame{transform-origin:center bottom;transform-box:fill-box;animation:fl .4s infinite alternate}
@keyframes fl{to{transform:scale(1.15,.9) rotate(4deg)}}
.candle.out .flame{display:none}
.smoke{opacity:0;fill:none;stroke:#999;stroke-width:3;stroke-linecap:round}
.candle.out .smoke{animation:sm 1.6s forwards}
@keyframes sm{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
/* letter */
.env{width:min(80vw,300px);height:190px;background:var(--accent);border-radius:10px;position:relative;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.2);transition:transform .6s}
.env::before{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.12) 50%) ,linear-gradient(225deg,transparent 50%,rgba(0,0,0,.08) 50%)}
.env .heart{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;transition:opacity .4s}
.letter{width:min(90vw,420px);background:var(--card);border-radius:12px;padding:24px 22px;text-align:left;line-height:1.9;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none;border:1px solid rgba(232,85,127,.25)}
.letter.open{display:block;animation:rise .9s}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.95)}}
.letter p{opacity:0;transform:translateY(8px);transition:all .7s;margin-bottom:.6em}
.letter p.in{opacity:1;transform:none}
.letter .sig{text-align:right;color:var(--accent);font-weight:700}
/* photos */
#s3{justify-content:flex-start}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;width:min(94vw,460px);padding:6px 0 10px}
.pol{background:#fff;color:#444;padding:8px 8px 10px;border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,.25);transform:rotate(var(--r));opacity:0;transition:opacity .8s,transform .4s;cursor:pointer}
.pol.in{opacity:1}
.pol:active,.pol.big{transform:rotate(0) scale(1.08);z-index:2}
.ph{aspect-ratio:1;background:linear-gradient(135deg,#ffd6e3,#ffb3cc);display:grid;place-items:center;font-size:2.4rem;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.pol small{display:block;margin-top:6px;font-size:.85rem}
.float{position:fixed;bottom:-30px;font-size:1.4rem;animation:up 7s linear forwards;pointer-events:none;z-index:1}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>

<!-- ฉาก 1: เค้ก -->
<section class="scene active" id="s1">
  <h1>🎂 มีอะไรรออยู่นะ…</h1>
  <p class="hint" id="hint1">แตะที่เทียนเพื่อเป่าให้ดับทีละเล่ม</p>
  <svg id="cake" viewBox="0 0 300 260">
    <ellipse cx="150" cy="240" rx="130" ry="14" fill="rgba(0,0,0,.15)"/>
    <rect x="30" y="150" width="240" height="85" rx="14" fill="#f7a8c4"/>
    <rect x="55" y="100" width="190" height="56" rx="12" fill="#ffd1e0"/>
    <path d="M30 160q15 22 30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0v-12H30z" fill="#fff"/>
    <path d="M55 108q12 18 24 0t24 0t24 0t24 0t24 0t24 0t22 0v-10H55z" fill="#fff"/>
    <circle cx="70" cy="200" r="6" fill="#e8557f"/><circle cx="150" cy="205" r="6" fill="#e8557f"/><circle cx="230" cy="200" r="6" fill="#e8557f"/>
    <g id="candles"></g>
  </svg>
  <button class="next" id="n1">ไปต่อ 💌</button>
</section>

<!-- ฉาก 2: จดหมาย -->
<section class="scene" id="s2">
  <p class="hint" id="hint2">มีจดหมายส่งมาถึงเธอ แตะเพื่อเปิด</p>
  <div class="env" id="env"><div class="heart">💌</div></div>
  <div class="letter" id="letter"></div>
  <button class="next" id="n2">ดูรูปของเรา 📸</button>
</section>

<!-- ฉาก 3: รูป -->
<section class="scene" id="s3">
  <h1 id="t3">ช่วงเวลาของเรา 💕</h1>
  <div class="grid" id="grid"></div>
  <button class="next" id="n3">🎉 ฉลองอีกครั้ง</button>
</section>

<canvas id="confetti"></canvas>

<script>
/* ===== แก้ตรงนี้ได้เลย ===== */
const NAME = "หยุมหยิมสุดที่รักรักที่สุด";
const LETTER = [
  "ถึง " + NAME + ",",
  "อายุ 20 ปี แล้วนะผ่านอะไรมามากเลย เหนื่อยไหม?",
  "อยากบอกว่าเธอเก่งมากๆ เลยนะ",
  "หลังจากนี้ก็อยากให้เธอมีความสุขมากๆ ขออะไรก็ให้สมดังหวังนะ",
  "เรามาผ่านมันไปด้วยกัน อยู่ด้วยกันไปนานๆ นะเธอ",
  "สุขสันต์วันเกิดนะ ขอบคุณที่อยู่ด้วยกันเสมอ รักที่สุดเลยอ้วน"
];
const SIGN = "จาก บอสคนที่รักอ้วนมากๆๆๆๆๆๆๆ ❤";
const PHOTOS = [ // src ใส่ลิงก์รูป หรือปล่อยว่างไว้ก่อน
  {src:"", cap:"ใส่คำบรรยายรูปที่ 1", emoji:"🌸"},
  {src:"", cap:"ใส่คำบรรยายรูปที่ 2", emoji:"🌅"},
  {src:"", cap:"ใส่คำบรรยายรูปที่ 3", emoji:"🍰"},
  {src:"", cap:"ใส่คำบรรยายรูปที่ 4", emoji:"🧸"}
];
const CANDLES = 5;
/* ========================= */

const $ = id => document.getElementById(id);
function go(from, to){
  $(from).classList.remove("active");
  setTimeout(()=>$(to).classList.add("active"), 500);
}

/* confetti */
const cv = $("confetti"), cx = cv.getContext("2d");
let parts = [], running = false;
function size(){cv.width = innerWidth; cv.height = innerHeight}
size(); addEventListener("resize", size);
function burst(n = 140){
  const cols = ["#ff5c8a","#ffd166","#06d6a0","#4cc9f0","#b388ff","#fff"];
  for(let i=0;i<n;i++){
    const left = i%2, a = (left ? -1 : 1) * (Math.random()*0.8+0.3);
    parts.push({x:left?innerWidth:0, y:innerHeight*0.75,
      vx:(left?-1:1)*(4+Math.random()*9), vy:-(8+Math.random()*12),
      s:5+Math.random()*7, c:cols[i%cols.length], r:Math.random()*6, vr:Math.random()*.3-.15, life:0});
  }
  if(!running){running = true; tick()}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p=>p.y < innerHeight+20 && p.life < 300);
  parts.forEach(p=>{
    p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore();
  });
  if(parts.length) requestAnimationFrame(tick); else running = false;
}

/* ฉาก 1: เทียน */
let out = 0;
const cg = $("candles"), ns = "http://www.w3.org/2000/svg";
for(let i=0;i<CANDLES;i++){
  const x = 80 + i*(140/(CANDLES-1)) + 0, g = document.createElementNS(ns,"g");
  g.setAttribute("class","candle");
  g.innerHTML = `<rect x="${x-5}" y="62" width="10" height="42" rx="3" fill="${["#4cc9f0","#ffd166","#b388ff","#06d6a0","#ff9aa2"][i%5]}"/>
  <rect x="${x-5}" y="62" width="10" height="42" rx="3" fill="url(#none)" opacity="0"/>
  <path class="smoke" d="M${x} 56c-6-8 6-14 0-24"/>
  <ellipse class="flame" cx="${x}" cy="52" rx="6" ry="11" fill="#ffb703"/>
  <ellipse class="flame" cx="${x}" cy="55" rx="3" ry="6" fill="#fff3b0"/>
  <rect x="${x-18}" y="20" width="36" height="90" fill="transparent"/>`;
  g.addEventListener("click", ()=>{
    if(g.classList.contains("out")) return;
    g.classList.add("out"); out++;
    if(navigator.vibrate) navigator.vibrate(30);
    if(out < CANDLES){ $("hint1").textContent = "ดับแล้ว " + out + "/" + CANDLES + " เล่ม เหลืออีก " + (CANDLES-out); }
    else {
      $("hint1").textContent = "สุขสันต์วันเกิด!! 🎉";
      $("s1").querySelector("h1").textContent = "🎉 Happy Birthday! 🎉";
      burst(100); setTimeout(()=>burst(100),500); setTimeout(()=>burst(80),1100);
      setTimeout(()=>$("n1").classList.add("show"), 2000);
    }
  });
  cg.appendChild(g);
}
$("n1").onclick = ()=>go("s1","s2");

/* ฉาก 2: จดหมาย */
let opened = false;
$("env").onclick = ()=>{
  if(opened) return; opened = true;
  $("env").style.display = "none"; $("hint2").style.display = "none";
  const L = $("letter"); L.classList.add("open");
  L.innerHTML = LETTER.map(t=>`<p>${t}</p>`).join("") + `<p class="sig">${SIGN}</p>`;
  [...L.children].forEach((p,i)=>setTimeout(()=>p.classList.add("in"), 700 + i*1100));
  setTimeout(()=>$("n2").classList.add("show"), 700 + L.children.length*1100 + 400);
};
$("n2").onclick = ()=>{go("s2","s3"); setTimeout(showPhotos, 1100)};

/* ฉาก 3: รูป */
let shown = false;
function showPhotos(){
  if(shown) return; shown = true;
  const gr = $("grid");
  PHOTOS.forEach((p,i)=>{
    const d = document.createElement("div");
    d.className = "pol"; d.style.setProperty("--r", (i%2 ? 3 : -3) + "deg");
    d.innerHTML = `<div class="ph">${p.src ? `<img src="${p.src}" alt="">` : p.emoji}</div><small>${p.cap}</small>`;
    d.onclick = ()=>d.classList.toggle("big");
    gr.appendChild(d);
    setTimeout(()=>d.classList.add("in"), 300 + i*700);
  });
  setInterval(()=>{
    if(!$("s3").classList.contains("active")) return;
    const f = document.createElement("div"); f.className = "float";
    f.textContent = ["💖","✨","🎈","💕"][Math.random()*4|0];
    f.style.left = Math.random()*95 + "vw"; document.body.appendChild(f);
    setTimeout(()=>f.remove(), 7000);
  }, 700);
  setTimeout(()=>$("n3").classList.add("show"), 300 + PHOTOS.length*700 + 600);
}
$("n3").onclick = ()=>{burst(160); setTimeout(()=>burst(120),400)};
</script>
</body>
</html>
